<!--page {"shell":"app","title":"Catalog","description":"Search the library catalog.","entry":"catalog","access":"member"} -->
<div class="container" data-page-root>
  <section class="welcome" id="welcome" hidden></section>
  <form class="finder card px" id="filters" role="search">
    <div class="finder__row">
      <div class="field search finder__search">
        <label class="visually-hidden" for="q">Search the catalog</label>
        <svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#search"/></svg>
        <input class="input" id="q" name="q" type="search" placeholder="Search by title, author or genre" autocomplete="off">
        <kbd class="finder__key" aria-hidden="true" title="Press / to search">/</kbd>
      </div>
      <fieldset class="segmented" aria-label="Availability">
        <label class="segmented__opt"><input type="radio" name="availability" value="all" checked><span>All books</span></label>
        <label class="segmented__opt"><input type="radio" name="availability" value="available"><span>Free now</span></label>
        <label class="segmented__opt"><input type="radio" name="availability" value="unavailable"><span>All out</span></label>
      </fieldset>
    </div>
    <div class="finder__subjects">
      <span class="finder__label" id="subjectLabel">Subjects</span>
      <div class="subject-chips" id="subjects" role="group" aria-labelledby="subjectLabel"></div>
    </div>
  </form>
  <div class="result-bar">
    <p class="result-count" id="resultCount" aria-live="polite"></p>
    <div class="result-bar__tools">
      <label class="visually-hidden" for="size">Books per page</label>
      <select class="select select--sm" id="size" name="size" form="filters"><option value="12">12 a page</option><option value="24">24 a page</option><option value="48">48 a page</option></select>
      <div class="view-toggle" role="group" aria-label="Layout">
        <button class="view-toggle__btn" type="button" data-view="grid" aria-pressed="true" title="Grid"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#dashboard"/></svg><span class="visually-hidden">Grid</span></button>
        <button class="view-toggle__btn" type="button" data-view="list" aria-pressed="false" title="List"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#menu"/></svg><span class="visually-hidden">List</span></button>
      </div>
      <button class="btn btn--quiet btn--sm" type="button" id="clearFilters"><svg class="icon" aria-hidden="true"><use href="/assets/icons/icons.svg#refresh"/></svg> Reset</button>
    </div>
  </div>
  <div class="grid grid--auto grid--wide shelf-grid" id="results"></div>
  <div id="pager"></div>
</div>
