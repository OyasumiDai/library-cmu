<!doctype html>
<html lang="en" data-theme="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | CMU Library</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0b1f5c">
  <link rel="icon" type="image/png" href="/assets/brand/cmu-library-favicon.png">
  <link rel="preload" href="/assets/fonts/PixelifySans.ttf?v=2" as="font" type="font/ttf" crossorigin>
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/site.css?v={{version}}">
  <script src="/config.js"></script>
</head>
<body data-page="{{page}}" data-access="{{access}}" class="app {{body}}">
  <a class="skip-link" href="#main">Skip to the content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu">
      <div class="sidebar__head">
        <a class="brand" href="/catalog" aria-label="CMU Library">
          <img class="brand__mark" src="/assets/brand/cmu-library-crest.png" alt="" width="42" height="42">
          <span class="brand__text"><span class="brand__title">CMU Library</span><span class="brand__sub">Read. Borrow. Explore.</span></span>
        </a>
        <button class="sidebar-fold" id="sidebarFold" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Collapse the sidebar" title="Collapse the sidebar">
          <svg class="icon icon--lg" aria-hidden="true"><use href="/assets/icons/icons.svg#chevron-left"/></svg>
        </button>
      </div>
      <nav class="sidebar__nav" aria-label="Main">
        {{nav}}
      </nav>
      <nav class="sidebar__foot" aria-label="Account">
        {{navFoot}}
      </nav>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="shell__main">
      <header class="topbar">
        <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="sidebar" aria-label="Open the menu">
          <svg class="icon icon--lg" aria-hidden="true"><use href="/assets/icons/icons.svg#menu"/></svg>
        </button>
        <span class="topbar__crumb">{{title}}</span>
        <div class="topbar__tools"><div class="user-widget" id="userWidget" data-state="loading"></div></div>
      </header>
      <main id="main" class="site-main" tabindex="-1">
{{content}}
      </main>
    </div>
  </div>
  <nav class="tabbar" data-visible="student" aria-label="Quick links">{{tabbar}}</nav>
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/assets/js/{{entry}}.js?v={{version}}"></script>
</body>
</html>
