<!doctype html>
<html lang="en" data-theme="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | CMU Library</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0b1f5c">
  <link rel="icon" type="image/png" href="/assets/brand/cmu-library-favicon.png">
  <link rel="preload" href="/assets/fonts/PixelifySans.ttf?v=2" as="font" type="font/ttf" crossorigin>
  <script src="/assets/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/site.css?v={{version}}">
  <script src="/config.js"></script>
</head>
<body data-page="{{page}}" data-access="{{access}}" class="landing {{body}}">
  <a class="skip-link" href="#main">Skip to the content</a>
  {{header}}
  <main id="main" class="site-main" tabindex="-1">
{{content}}
  </main>
  {{footer}}
  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/assets/js/{{entry}}.js?v={{version}}"></script>
</body>
</html>
